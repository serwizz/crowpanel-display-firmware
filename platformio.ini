; CrowPanel 5.79 E-Paper HMI (ESP32-S3-WROOM-1-N8R8, dual SSD1683).
; The panel hangs off a CH340 USB-UART bridge (/dev/ttyUSB0): the same
; port carries flashing, frames and logs.
[env:crowpanel579]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; N8R8: 8MB flash (quad) + 8MB PSRAM (octal)
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags =
    -DSERIAL_BAUD=460800
    -DBOARD_HAS_PSRAM
monitor_speed = 460800
upload_speed = 921600
; the port is picked automatically; with several USB-serial adapters set:
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
